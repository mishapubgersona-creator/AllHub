<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AllHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    #29314a 0%,
                    #111520 45%,
                    #080a0f 100%
                );

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            padding: 45px 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        /* ЛОГОТИП */

        .logo {
            text-align: center;

            font-size: 58px;
            font-weight: 900;

            letter-spacing: -3px;

            margin-bottom: 8px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #879aff,
                    #ffffff
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            text-shadow:
                0 0 35px rgba(90, 110, 255, 0.25);
        }

        .subtitle {
            text-align: center;

            color: #858da0;

            font-size: 15px;

            margin-bottom: 35px;
        }

        /* КОНТЕЙНЕР ФАЙЛОВ */

        .files-box {
            width: 100%;

            background:
                rgba(17, 21, 31, 0.9);

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.03);

            backdrop-filter: blur(20px);
        }

        /* ПАПКА */

        .folder-header {
            min-height: 70px;

            display: flex;

            align-items: center;

            padding: 0 25px;

            background:
                rgba(255,255,255,0.025);

            border-bottom:
                1px solid rgba(255,255,255,0.07);
        }

        .folder-icon {
            font-size: 27px;
            margin-right: 13px;
        }

        .folder-name {
            font-size: 19px;
            font-weight: 700;
        }

        .file-count {
            margin-left: auto;

            color: #747d91;

            font-size: 14px;
        }

        /* СПИСОК */

        #file-list {
            width: 100%;
        }

        /* ФАЙЛ */

        .file {
            min-height: 76px;

            display: flex;

            align-items: center;

            padding: 15px 20px;

            border-bottom:
                1px solid rgba(255,255,255,0.055);

            transition:
                background 0.2s ease;
        }

        .file:last-child {
            border-bottom: none;
        }

        .file:hover {
            background:
                rgba(255,255,255,0.045);
        }

        /* ИКОНКА ФАЙЛА */

        .file-icon {
            width: 45px;
            height: 45px;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                #252a3a;

            border-radius: 12px;

            font-size: 22px;

            margin-right: 15px;

            flex-shrink: 0;
        }

        /* ИНФОРМАЦИЯ */

        .file-info {
            flex: 1;

            min-width: 0;
        }

        .file-name {
            color: white;

            font-size: 16px;

            font-weight: 600;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .file-type {
            color: #747d90;

            font-size: 13px;

            margin-top: 5px;
        }

        /* КНОПКА */

        .download {
            border: none;
            outline: none;

            background:
                linear-gradient(
                    135deg,
                    #5b6fff,
                    #4054e8
                );

            color: white;

            padding: 11px 19px;

            border-radius: 10px;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition:
                all 0.2s ease;

            box-shadow:
                0 5px 18px
                rgba(70,90,255,0.25);

            flex-shrink: 0;
        }

        .download:hover {
            transform:
                translateY(-2px);

            background:
                linear-gradient(
                    135deg,
                    #6c7eff,
                    #4c60f2
                );

            box-shadow:
                0 8px 25px
                rgba(70,90,255,0.45);
        }

        .download:active {
            transform:
                scale(0.95);
        }

        /* ЗАГРУЗКА */

        .loading {
            padding: 35px 20px;

            text-align: center;

            color: #747d91;

            font-size: 14px;
        }

        /* НЕТ ФАЙЛОВ */

        .empty {
            padding: 40px 20px;

            text-align: center;

            color: #747d91;

            font-size: 14px;
        }

        /* ОШИБКА */

        .error {
            padding: 30px 20px;

            text-align: center;

            color: #ff7b7b;

            font-size: 14px;

            line-height: 1.6;
        }

        /* СООБЩЕНИЕ */

        .message {
            position: fixed;

            left: 50%;
            bottom: 30px;

            transform:
                translate(-50%, 100px);

            background:
                #202636;

            border:
                1px solid
                rgba(255,255,255,0.1);

            color: white;

            padding: 14px 22px;

            border-radius: 12px;

            font-size: 14px;

            box-shadow:
                0 10px 35px
                rgba(0,0,0,0.4);

            opacity: 0;

            transition:
                all 0.3s ease;

            z-index: 100;

            pointer-events: none;
        }

        .message.show {
            opacity: 1;

            transform:
                translate(-50%, 0);
        }

        /* МОБИЛЬНАЯ ВЕРСИЯ */

        @media (max-width: 600px) {

            body {
                padding:
                    25px 12px;
            }

            .logo {
                font-size: 43px;
            }

            .subtitle {
                margin-bottom: 25px;
            }

            .folder-header {
                padding:
                    0 17px;
            }

            .file {
                padding:
                    13px;
            }

            .file-icon {
                width: 40px;
                height: 40px;

                margin-right: 10px;
            }

            .file-name {
                font-size: 14px;
            }

            .file-type {
                font-size: 12px;
            }

            .download {
                padding:
                    9px 12px;

                font-size: 12px;
            }
        }
    </style>
</head>


<body>

<div class="container">

    <!-- НАЗВАНИЕ -->

    <div class="logo">
        AllHub
    </div>

    <div class="subtitle">
        Файловый каталог
    </div>


    <!-- ПАПКА -->

    <div class="files-box">

        <div class="folder-header">

            <div class="folder-icon">
                📁
            </div>

            <div class="folder-name">
                files
            </div>

            <div
                class="file-count"
                id="file-count">

                Загрузка...

            </div>

        </div>


        <!-- СЮДА JAVASCRIPT ДОБАВИТ ФАЙЛЫ -->

        <div id="file-list">

            <div class="loading">
                Загрузка файлов...
            </div>

        </div>

    </div>

</div>


<!-- УВЕДОМЛЕНИЕ -->

<div
    class="message"
    id="message">

    Подготовка файла...

</div>


<script>

/*
==================================================
 НАСТРОЙКИ
==================================================
*/


/*
 Папка с файлами в репозитории
*/

const FILES_FOLDER = "files";


/*
 Через сколько автоматически обновлять каталог.

 60000 = 1 минута
*/

const UPDATE_INTERVAL = 60000;


/*
==================================================
 ОПРЕДЕЛЯЕМ GITHUB REPOSITORY
==================================================
*/

function getGitHubRepository() {

    const hostname = window.location.hostname;

    const pathname =
        window.location.pathname
        .split("/")
        .filter(Boolean);


    /*
    Сайт вида:

    username.github.io

    Тогда репозиторий обычно:

    username/username.github.io
    */

    if (
        hostname.endsWith(".github.io")
    ) {

        const username =
            hostname.split(".")[0];

        /*
        Если это:

        username.github.io

        без дополнительной папки
        */

        if (pathname.length === 0) {

            return {
                owner: username,
                repo: username + ".github.io"
            };

        }


        /*
        Если сайт вида:

        username.github.io/my-site/
        */

        return {
            owner: username,
            repo: pathname[0]
        };

    }


    /*
    Если используется другой домен,
    можно указать repository вручную.

    Например:

    owner: "MyUsername"
    repo: "MyRepository"
    */

    return {
        owner: "",
        repo: ""
    };
}


/*
==================================================
 ПОЛУЧАЕМ REPOSITORY
==================================================
*/

const repository =
    getGitHubRepository();


/*
==================================================
 ПОЛУЧЕНИЕ ФАЙЛОВ
==================================================
*/

async function loadFiles() {

    const fileList =
        document.getElementById("file-list");

    const fileCount =
        document.getElementById("file-count");


    /*
    Проверяем repository
    */

    if (
        !repository.owner ||
        !repository.repo
    ) {

        fileList.innerHTML = `
            <div class="error">
                Не удалось определить GitHub Repository.
                <br><br>
                Если используется собственный домен,
                укажи owner и repo в коде.
            </div>
        `;

        fileCount.textContent = "Ошибка";

        return;
    }


    try {

        /*
        GitHub API

        Получаем содержимое папки files
        */

        const apiUrl =
            `https://api.github.com/repos/` +
            `${repository.owner}/` +
            `${repository.repo}/contents/` +
            `${FILES_FOLDER}?t=${Date.now()}`;


        const response =
            await fetch(apiUrl, {
                cache: "no-store"
            });


        /*
        Проверяем ответ
        */

        if (!response.ok) {

            throw new Error(
                "GitHub API HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        /*
        Проверяем, что GitHub
        действительно вернул массив
        */

        if (!Array.isArray(data)) {

            throw new Error(
                "Папка files не найдена"
            );

        }


        /*
        Оставляем только файлы.

        Папки игнорируем.
        */

        const files =
            data.filter(
                item => item.type === "file"
            );


        /*
        Сортировка по названию
        */

        files.sort(
            (a, b) =>
                a.name.localeCompare(
                    b.name,
                    "ru",
                    {
                        numeric: true,
                        sensitivity: "base"
                    }
                )
        );


        /*
        Количество файлов
        */

        fileCount.textContent =
            getFileCountText(files.length);


        /*
        Если файлов нет
        */

        if (files.length === 0) {

            fileList.innerHTML = `
                <div class="empty">
                    📂 Папка files пуста
                </div>
            `;

            return;
        }


        /*
        Создаём HTML каталога
        */

        fileList.innerHTML =
            files
                .map(createFileHTML)
                .join("");


    } catch (error) {

        console.error(
            "Ошибка загрузки каталога:",
            error
        );


        fileList.innerHTML = `
            <div class="error">
                ❌ Не удалось загрузить список файлов.
                <br><br>
                Проверь, что папка
                <b>files</b>
                существует в репозитории.
            </div>
        `;

        fileCount.textContent =
            "Ошибка";
    }
}


/*
==================================================
 СОЗДАНИЕ ФАЙЛА
==================================================
*/

function createFileHTML(file) {

    const fileName =
        escapeHTML(file.name);


    const extension =
        getExtension(file.name);


    const fileType =
        getFileType(file.name);


    const icon =
        getFileIcon(file.name);


    /*
    GitHub raw URL

    Используем download_url,
    который отдаёт GitHub API.
    */

    const downloadURL =
        file.download_url;


    return `

        <div class="file">

            <div class="file-icon">
                ${icon}
            </div>


            <div class="file-info">

                <div
                    class="file-name"
                    title="${fileName}">

                    ${fileName}

                </div>


                <div class="file-type">

                    ${fileType}

                    ${
                        extension
                        ? " • ." + extension
                        : ""
                    }

                </div>

            </div>


            <button
                class="download"
                onclick='downloadFile(
                    ${JSON.stringify(downloadURL)},
                    ${JSON.stringify(file.name)}
                )'>

                Скачать

            </button>

        </div>

    `;
}


/*
==================================================
 СКАЧИВАНИЕ
==================================================
*/

async function downloadFile(
    fileUrl,
    fileName
) {

    const message =
        document.getElementById("message");


    /*
    Находим нажатую кнопку
    */

    const buttons =
        document.querySelectorAll(".download");


    let currentButton = null;


    buttons.forEach(button => {

        /*
        Ничего не делаем,
        если кнопка не найдена
        */

    });


    try {

        message.textContent =
            "Подготовка файла...";

        message.classList.add("show");


        /*
        Загружаем файл
        */

        const response =
            await fetch(
                fileUrl,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const blob =
            await response.blob();


        /*
        Создаём временный URL
        */

        const blobUrl =
            URL.createObjectURL(blob);


        /*
        Создаём ссылку
        */

        const link =
            document.createElement("a");


        link.href =
            blobUrl;

        link.download =
            fileName;

        link.style.display =
            "none";


        document.body.appendChild(
            link
        );


        /*
        Запускаем скачивание
        */

        link.click();


        /*
        Удаляем ссылку
        */

        link.remove();


        /*
        Освобождаем память
        */

        setTimeout(() => {

            URL.revokeObjectURL(
                blobUrl
            );

        }, 1000);


        /*
        Сообщение
        */

        message.textContent =
            "✓ Файл скачивается";


        setTimeout(() => {

            message.classList.remove(
                "show"
            );

        }, 2500);


    } catch (error) {

        console.error(
            "Ошибка скачивания:",
            error
        );


        /*
        Если fetch не сработал,
        просто открываем файл.
        */

        window.open(
            fileUrl,
            "_blank"
        );


        message.textContent =
            "Файл открыт";


        setTimeout(() => {

            message.classList.remove(
                "show"
            );

        }, 2500);
    }
}


/*
==================================================
 ОПРЕДЕЛЕНИЕ РАСШИРЕНИЯ
==================================================
*/

function getExtension(fileName) {

    const parts =
        fileName.split(".");


    if (parts.length < 2) {
        return "";
    }


    return parts
        .pop()
        .toLowerCase();
}


/*
==================================================
 ТИП ФАЙЛА
==================================================
*/

function getFileType(fileName) {

    const extension =
        getExtension(fileName);


    const types = {

        lua: "Lua Script",

        js: "JavaScript",

        html: "HTML",

        css: "CSS",

        json: "JSON",

        txt: "Текстовый файл",

        pdf: "PDF документ",

        zip: "ZIP архив",

        rar: "RAR архив",

        "7z": "7Z архив",

        exe: "Windows приложение",

        apk: "Android приложение",

        mp3: "Аудиофайл",

        wav: "Аудиофайл",

        mp4: "Видео",

        webm: "Видео",

        jpg: "Изображение",

        jpeg: "Изображение",

        png: "Изображение",

        gif: "GIF изображение",

        webp: "Изображение",

        doc: "Документ",

        docx: "Word документ",

        xls: "Excel таблица",

        xlsx: "Excel таблица",

        ppt: "PowerPoint",

        pptx: "PowerPoint"

    };


    return (
        types[extension] ||
        "Файл"
    );
}


/*
==================================================
 ИКОНКА
==================================================
*/

function getFileIcon(fileName) {

    const extension =
        getExtension(fileName);


    const icons = {

        lua: "📜",

        js: "📜",

        html: "🌐",

        css: "🎨",

        json: "📋",

        txt: "📄",

        pdf: "📕",

        zip: "🗜️",

        rar: "🗜️",

        "7z": "🗜️",

        exe: "⚙️",

        apk: "📱",

        mp3: "🎵",

        wav: "🎵",

        mp4: "🎬",

        webm: "🎬",

        jpg: "🖼️",

        jpeg: "🖼️",

        png: "🖼️",

        gif: "🖼️",

        webp: "🖼️",

        doc: "📘",

        docx: "📘",

        xls: "📊",

        xlsx: "📊",

        ppt: "📙",

        pptx: "📙"

    };


    return (
        icons[extension] ||
        "📄"
    );
}


/*
==================================================
 ПРАВИЛЬНОЕ КОЛИЧЕСТВО
==================================================
*/

function getFileCountText(count) {

    if (
        count % 10 === 1 &&
        count % 100 !== 11
    ) {

        return count + " файл";

    }


    if (
        count >= 2 &&
        count <= 4
    ) {

        return count + " файла";

    }


    return count + " файлов";
}


/*
==================================================
 ЗАЩИТА HTML
==================================================
*/

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/*
==================================================
 ПЕРВАЯ ЗАГРУЗКА
==================================================
*/

loadFiles();


/*
==================================================
 АВТОМАТИЧЕСКОЕ ОБНОВЛЕНИЕ
==================================================

Каждую минуту проверяем GitHub
на наличие новых файлов.
*/

setInterval(
    loadFiles,
    UPDATE_INTERVAL
);


/*
==================================================
 ОБНОВЛЕНИЕ ПРИ ВОЗВРАЩЕНИИ НА ВКЛАДКУ
==================================================
*/

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.visibilityState ===
            "visible"
        ) {

            loadFiles();

        }

    }
);

</script>

</body>
</html>
