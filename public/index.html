<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MashUnion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #050817;
    --bg-mid: #0a1130;
    --bg-light: #101a4a;
    --purple: #8b5cf6;
    --purple-soft: #a78bfa;
    --purple-glow: rgba(139, 92, 246, 0.55);
    --text: #e6e9ff;
    --muted: #7c85b8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Manrope', sans-serif;
    background: var(--bg-deep);
    color: var(--text);
  }

  /* Фоновые градиентные пятна */
  .bg-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.55;
    pointer-events: none;
    z-index: 0;
  }
  .orb-1 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, #5b21b6, transparent 70%);
    top: -150px; left: -100px;
    animation: float1 18s ease-in-out infinite;
  }
  .orb-2 {
    width: 600px; height: 600px;
    background: radial-gradient(circle, #1e3a8a, transparent 70%);
    bottom: -200px; right: -150px;
    animation: float2 22s ease-in-out infinite;
  }
  .orb-3 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, #6d28d9, transparent 70%);
    top: 40%; left: 50%;
    animation: float3 25s ease-in-out infinite;
  }

  @keyframes float1 {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(80px, 60px) scale(1.15); }
  }
  @keyframes float2 {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(-100px, -80px) scale(1.2); }
  }
  @keyframes float3 {
    0%,100% { transform: translate(-50%,-50%) scale(1); }
    50% { transform: translate(-30%,-70%) scale(1.1); }
  }

  /* Сетка поверх фона */
  .grid-overlay {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(139, 92, 246, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139, 92, 246, 0.06) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: 1;
    mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
    animation: gridShift 40s linear infinite;
  }

  @keyframes gridShift {
    from { background-position: 0 0, 0 0; }
    to { background-position: 60px 60px, 60px 60px; }
  }

  /* Логотип */
  .logo {
    position: fixed;
    top: 32px;
    left: 32px;
    z-index: 10;
    padding: 14px 26px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.5px;
    color: #fff;
    background: linear-gradient(135deg, var(--purple) 0%, #6d28d9 100%);
    border-radius: 18px;
    box-shadow:
      0 0 0 1px rgba(167, 139, 250, 0.3),
      0 10px 40px var(--purple-glow),
      inset 0 1px 0 rgba(255,255,255,0.2);
    cursor: default;
    animation: logoIn 1s cubic-bezier(0.16, 1, 0.3, 1) both;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s;
  }
  .logo:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow:
      0 0 0 1px rgba(167, 139, 250, 0.5),
      0 16px 60px var(--purple-glow),
      inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .logo span {
    background: linear-gradient(90deg, #fff, #d8b4fe);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  @keyframes logoIn {
    from { opacity: 0; transform: translate(-30px, -30px) scale(0.8); }
    to   { opacity: 1; transform: translate(0, 0) scale(1); }
  }

  /* Центральный контент */
  .hero {
    position: relative;
    z-index: 5;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 24px;
  }

  .hero h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(48px, 10vw, 140px);
    font-weight: 700;
    line-height: 0.95;
    letter-spacing: -0.03em;
    background: linear-gradient(180deg, #ffffff 0%, #a78bfa 60%, #6d28d9 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    opacity: 0;
    animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
  }

  .hero .sub {
    margin-top: 24px;
    font-size: clamp(14px, 1.6vw, 18px);
    font-weight: 300;
    color: var(--muted);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
  }

  .hero .line {
    margin-top: 40px;
    width: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--purple), transparent);
    animation: lineGrow 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.9s forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); filter: blur(8px); }
    to   { opacity: 1; transform: translateY(0); filter: blur(0); }
  }
  @keyframes lineGrow {
    to { width: 220px; }
  }

  /* Плавающие точки */
  .particles {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }
  .particle {
    position: absolute;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--purple-soft);
    box-shadow: 0 0 8px var(--purple-glow);
    opacity: 0;
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translateY(100vh) scale(0); opacity: 0; }
    10%  { opacity: 0.9; }
    90%  { opacity: 0.7; }
    100% { transform: translateY(-20vh) scale(1.3); opacity: 0; }
  }

  /* Статус-индикатор */
  .status {
    position: fixed;
    bottom: 32px;
    right: 32px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 10px 16px;
    background: rgba(10, 17, 48, 0.6);
    border: 1px solid rgba(139, 92, 246, 0.2);
    border-radius: 100px;
    backdrop-filter: blur(12px);
    opacity: 0;
    animation: fadeUp 1s ease 1.5s forwards;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--purple);
    box-shadow: 0 0 12px var(--purple-glow);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.7); }
  }

  @media (max-width: 600px) {
    .logo { top: 20px; left: 20px; padding: 12px 20px; font-size: 18px; border-radius: 14px; }
    .status { bottom: 20px; right: 20px; font-size: 10px; padding: 8px 12px; }
  }
</style>
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>
  <div class="grid-overlay"></div>
  <div class="particles" id="particles"></div>

  <div class="logo"><span>MashUnion</span></div>

  <main class="hero">
    <h1>MashUnion</h1>
    <p class="sub">Digital · Future · Now</p>
    <div class="line"></div>
  </main>

  <div class="status">
    <span class="dot"></span>
    <span>Online</span>
  </div>

<script>
  // Регистрация визита
  fetch('/api/visit', { method: 'POST' }).catch(() => {});

  // Генерация плавающих частиц
  const particles = document.getElementById('particles');
  const count = 30;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    const size = 1 + Math.random() * 3;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    particles.appendChild(p);
  }
</script>
</body>
</html>
